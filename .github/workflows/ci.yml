name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL real para los tests de integración (servidor MCP, planes, auditoría).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataops_admin
          POSTGRES_PASSWORD: ci_admin_123
          POSTGRES_DB: dataops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataops_admin -d dataops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATAOPS_TEST_DSN: "host=localhost port=5432 user=dataops_admin password=ci_admin_123 dbname=dataops"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests (unitarios e integración)
        run: pytest -v
