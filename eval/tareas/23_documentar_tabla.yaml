id: "23"
titulo: Documentar una tabla en el propio modelo
categoria: documentacion
preparacion: modelado
instruccion: >
  Documenta en la base de datos la tabla clientes y su columna segmento con una
  descripción de negocio (qué representa la tabla; qué significa la columna y qué valores
  toma), de forma que la vean otras herramientas como Metabase.
notas: >
  Mide que la descripción quede en el catálogo de PostgreSQL (COMMENT ON) y que se base
  en los datos reales (los valores de segmento son 'particular' y 'empresa'), sin tocar
  las filas.
comprobaciones:
  - tipo: consulta
    sql: SELECT (obj_description('{esquema}.clientes'::regclass, 'pg_class') IS NOT NULL)::int
    valor: 1
  - tipo: consulta
    sql: >
      SELECT (col_description('{esquema}.clientes'::regclass,
              (SELECT attnum FROM pg_attribute
               WHERE attrelid = '{esquema}.clientes'::regclass AND attname = 'segmento'))
              ILIKE '%particular%empresa%'
           OR col_description('{esquema}.clientes'::regclass,
              (SELECT attnum FROM pg_attribute
               WHERE attrelid = '{esquema}.clientes'::regclass AND attname = 'segmento'))
              ILIKE '%empresa%particular%')::int
    valor: 1
  - {tipo: recuento, tabla: clientes, valor: "{demo.filas.clientes}"}
